		<p>Thursday, Aug. 29, 1907</p>
		<p>Iffley.</p>
		<p>Went up with Karin and saw the last of Heath, who is going to take a Rest Cure at Deal. He advised us to go to Harrogate for Karin’s health.</p>
		<p>Bernhard drove with Dora di Rudini to the Bernina Hospice and had lunch, and the walked to Alp Gran.</p>
