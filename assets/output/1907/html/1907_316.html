		<p>Monday, Oct. 21, 1907</p>
		<p>Fine.</p>
		<p>Scott, Rothenstein.</p>
		<p>Drove Scott and Rothenstein round by Poggio and Settignano — lovely — getting back rather late to tea with the Clinton Brocks.</p>
		<p>We all dined with Mrs. Ross, and afterwards sat out.</p>
