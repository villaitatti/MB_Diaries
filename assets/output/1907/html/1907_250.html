		<p>Friday, Aug. 16, 1907</p>
		<p>Court Place.</p>
		<p>Fine.</p>
		<p>Keynes came to lunch. We all liked him. Then we came down. The others met us in the launch.</p>
		<p>Dora drove Bernhard to see Gladys, who was most affectionate and flattering. He drove back with Mme Greffulhe. Dined with the Rudinis.</p>
