		<p>Monday, Sept. 2, 1907</p>
		<p>Pouring.</p>
		<p>Quiet day with bath.</p>
		<p>Bernhard reached Paris and went to <b>Laversine</b>, and then went with Lady Sassoon and Mme Lambert to Rouen for the night, motoring.</p>
		<p>They saw Les Andelys and Château Gaillard also Gisors.</p>
