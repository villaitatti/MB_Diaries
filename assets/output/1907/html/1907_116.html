		<p>Thursday, Apr. 4, 1907</p>
		<p>London. Rain and sun.</p>
		<p>Came up and went to doctor. He seems to give evasive answers to our questions. What is wrong? I feel <i>awfully</i> anxious. Shopped with Mrs. Stewart. Dined at Ship.</p>
		<p>The Dowdeswells lunched with Bernhard, and the Serristori came for three hours. Pouring.</p>
