		<p>Wednesday, Apr. 3, 1907</p>
		<p>Oxford. Rainy.</p>
		<p>Quiet day of stock-taking in clothes. Ray and Karin went sailing.</p>
		<p>Dr. Wright called on Bernhard, bringing his nephew, Hagborg, the Librarian of the London Library.</p>
		<p>The Pringsheims came to tea, and Hutchins dropped in after dinner.</p>
