		<p>Thursday, Aug. 22, 1907</p>
		<p>2 Morpeth Terrace.</p>
		<p>Scott came in a very jolly mood. We went to the National Gallery and looked at Michelangelo and Tura. In the evening we went to Iolanthe, which was very amusing.</p>
		<p>Bernhard corrected <i>North Italian</i> proofs and had a walk with <b>Lambert and Lady Sassoon.</b></p>
