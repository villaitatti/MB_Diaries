		<p>Friday, Aug. 23, 1907</p>
		<p>Iffley.</p>
		<p>Came back and joined the jolly party here. Houghton met me at the station.</p>
		<p>B.B. went with Carlo to Sils to see Kreisler.</p>
		<p>Lunched with Robilants, Bengham and Mme Yturi.</p>
		<p>Walked with <b>Lamberts</b>.</p>
		<p>Watched ball at Kul__. Dined with Mrs. Lawrence.</p>
