		<p>Saturday, Aug. 11, 1907</p>
		<p>Glaenzer came down to see the Dosso portrait. We met him in the launch. He says Roger Fry is suffering very much from “swelled head”, and gives his opinion recklessly on things he really does not know about.</p>
		<p>Bernhard dines with the Untermeyers and then watched a cotillon.</p>
