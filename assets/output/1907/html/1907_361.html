		<p>Thursday, Dec. 5, 1907</p>
		<p>Rainy.</p>
		<p>Algar.</p>
		<p>Worked.</p>
		<p>Mr. J. H. Breck came to lunch, a feeble, unimportant pupil of Denman Ross.</p>
		<p>Craig sent up his etchings, asking B.B. to write a preface. We had to take them 400 francs. B.B. does not particularly like them.</p>
