		<p>Wednesday, May 15, 1907</p>
		<p>Magic.</p>
		<p>Swimming and youthful larks. They are delicious, all of them.</p>
		<p>Hugh Morgan joined the party and promptly fell in love with Margaret. Everybody seems enchanted with everybody else — it is quite wonderful.</p>
