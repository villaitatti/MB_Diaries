		<p>Saturday, Aug. 24, 1907</p>
		<p>Iffley.</p>
		<p>2 Houghtons, 3 Radfords, 2 Rendels, 2 Pophams.</p>
		<p>Houghton motored us up to Boars’ Hill to see if the <u>Sttydeo</u> there would do, but it seemed too bad.</p>
		<p>We had a dance in the evening, which the young people appeared greatly to enjoy.</p>
		<p>Tremendous romps at B.B.’s hotel.</p>
	</body>
