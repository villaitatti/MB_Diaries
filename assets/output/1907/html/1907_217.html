		<p>Sunday, July 14, 1907</p>
		<p>Iffley. Misty.</p>
		<p>Talked with Mother and Grace in the morning and steam-launched to Abingdon in the afternoon. Ray tried her powers at Palmistry and announced that Grace was “Morose, fiery and coarse”!</p>
		<p>Bernhard saw Dickinson and the Schillers and had plenty of good talk.</p>
