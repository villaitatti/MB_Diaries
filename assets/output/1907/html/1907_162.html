		<p>Monday, May 20, 1907</p>
		<p>Fine.</p>
		<p>Hotel Brufani, Perugia.</p>
		<p>Came here and joined B.B., Placci, Lucien, Mme Serristori and Rembrelinsky at lunch.</p>
		<p>Went to Exposition.</p>
		<p>Very happy to see Bernhard again.</p>
		<p>Margaret, Karin and Albert read Pater together.</p>
