		<p>Tuesday, Sept. 10, 1907</p>
		<p>Fine.</p>
		<p>Mother and Ray and Alice and I motored to see some houses, Milton House and Kingston Lisle Park in especial, neither of them suitable, though both most beautiful.</p>
		<p>Bernhard with his friends went by steamer along the coast of Morbihan, and then by motor to Nantes.</p>
