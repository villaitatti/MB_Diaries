		<p>Friday, Oct. 11, 1907</p>
		<p>Fine.</p>
		<p>Scott, Rothenstein.</p>
		<p>A fearfully sad letter from poor <b>Karin, who got quite deaf when she went up to Newnham</b>. I was upset, horribly, and cried all day.</p>
		<p>Placci and Buonamici and Albert and his mother spent the afternoon.</p>
