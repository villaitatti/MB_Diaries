		<p>Saturday, Aug. 31, 1907</p>
		<p>Explored the town and had a bath.</p>
		<p>Bernhard lunched with the Princesse Lynar (<i>née</i> Parsons of Columbus, Ohio), the Trabias and Placci. At 3.30 the Shillers came to tea.</p>
		<p>Placci and he dined with Dora to meet the Birrels.</p>
