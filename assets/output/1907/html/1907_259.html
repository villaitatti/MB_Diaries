		<p>Sunday, Aug. 25, 1907</p>
		<p>Iffley. Same party minus Pophams.</p>
		<p>Houghton motored Logan and Grace and me to Burford, Bibury, Fairford, Kelmscott and Dorchester — all fascinating places.</p>
		<p>B.B. lunched with the usual band, and had tea with Mme Greffulhe.</p>
