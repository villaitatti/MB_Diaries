		<p>Wednesday, June 26, 1907</p>
		<p>Fine.</p>
		<p>Walked a little.</p>
		<p>Read James’ <i>Pragmatism</i>, Anatole France.</p>
		<p>Wrote.</p>
		<p>The hotel is not very good, but the air is enchanting.</p>
		<p>Ray started yesterday with the Houghtons. Ellie and Cecil on the motor.</p>
		<p>Karin at Christ Church Ball danced till 5 and was rapturously happy.</p>
	</body>
