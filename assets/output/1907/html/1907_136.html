		<p>Wednesday, Apr. 24, 1907</p>
		<p>Fine.</p>
		<p>Switzerland-Italy.</p>
		<p>All day in train. Too aching and weary to read.</p>
		<p>It is awfully hard not to worry about Karin, but I simply mustn’t break down, for every possible reason.</p>
		<p>Mathers to lunch. Serristori and Rembelinski to tea. Agnes to dine.</p>
