		<p>Tuesday, Oct. 22, 1907</p>
		<p>Fine.</p>
		<p>Mather came to lunch. Scott, Rothenstein and I drove over and called upon Gordon Craig. Strange, unconventional, promiscuous household — all free love and flies.</p>
		<p>We liked Craig’s etchings, however, and found him handsome and attractive, though rather apostolic.</p>
