		<p>Sunday, Oct. 20, 1907</p>
		<p>Fine.</p>
		<p>Scott, Rothenstein.</p>
		<p>Rizi Visconti Venosta came to lunch, very life-diminishing.</p>
		<p>We all went to the Gamberaia, where there were all sorts of people.</p>
		<p>Scott, Rothenstein and I dined on the Houghtons’ tower, with Pinsent and the Howells. Somehow we were all bored.</p>
