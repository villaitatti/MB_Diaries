		<p>Monday, Mar. 25, 1907</p>
		<p>Members Mandions, Victoria St., S.W.</p>
		<p>Fine.</p>
		<p>Crossed to London 12-7.5. Logan met me here and we dined together.</p>
		<p>Bernhard had the Cooks and Thorolds to dine.</p>
		<p>Horne called with Acton (!) in the afternoon and Corradini came later.</p>
