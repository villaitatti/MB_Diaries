		<p>Thursday, June 20, 1907</p>
		<p>Hot.</p>
		<p>Finished my tiresome article for the <i>Gazette</i>. B.B. finished his on Girolamo di Giovanni da Camerino.</p>
		<p>He went to town to see Horne.</p>
		<p>I watched the girls swim. They went in without bathing-dresses.</p>
		<p>Finished <i>St Francis and his Companions</i> (Macdonell).</p>
