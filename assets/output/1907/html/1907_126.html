		<p>Sunday, Apr. 14, 1907</p>
		<p>London.</p>
		<p>Situation unchanged.</p>
		<p>Heard divine music at the Cathedral, which comforted me. Called on beautiful Mrs. Leigh Smith.</p>
		<p>Bernhard took Lady Sassoon to churches and in the afternoon to the Boboli Gardens.</p>
		<p>Agnes dined with him.</p>
