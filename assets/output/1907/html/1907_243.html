		<p>Friday, Aug. 9, 1907</p>
		<p>Court Place. Fine.</p>
		<p>Had a Turkish Bath and came here.</p>
		<p>Bernhard went with Gladys, Mr. Baldwin and Doria to the Roseg Glacier. B.B. found it ravishing to be with Gladys, though he never lost his conviction that she was lying and that she didn’t care a bit about him.</p>
