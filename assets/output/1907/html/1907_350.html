		<p>Sunday, Nov. 24, 1907</p>
		<p>Fairish.</p>
		<p>Villa Donoratico (Serristori), Castagneto Carducci.</p>
		<p>Walked together in morning, Bernhard with Contessa and I with the delicious children in the afternoon. We met a swineherd tending his pigs and blowing a sea-shell to call them home.</p>
		<p>Dado is a <i>delightful</i> child.</p>
