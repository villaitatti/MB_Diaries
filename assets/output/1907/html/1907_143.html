		<p>Wednesday, May 1, 1907</p>
		<p>Albergo Villa di Roma, Benevento. Fine.</p>
		<p>I was somewhat better. Saw Capua and Capua Vetere, with its *Amphitheatre, and *St. Angelo in Formis and luknched at Caserta.</p>
		<p>Came on here, but were delayed by repairs to the machine.</p>
		<p>The country is very beautiful.</p>
