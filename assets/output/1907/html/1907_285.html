		<p>Friday, Sept. 20, 1907</p>
		<p>Paris.</p>
		<p>Lunched with the Sherrills. Called on Reinach.</p>
		<p>Dined with Steins, who spent the evening giving Bernhard a very unflattering portrait of his character! They turn out to be frightfully self-conscious and touchy.</p>
