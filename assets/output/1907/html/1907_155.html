		<p>Monday, May 13, 1907</p>
		<p>Enchantment.</p>
		<p><b>All the young people swam and played about while we watched.</b></p>
		<p>Dr. Giglioli and Dr. Heath had a consultation over me, and rather scared me about my general health.</p>
		<p>Albert Spalding stayed to lunch — a delightful boy, <i>so</i> clever and talented.</p>
