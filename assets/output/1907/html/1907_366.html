		<p>Tuesday, Dec. 10, 1907</p>
		<p>Rainy.</p>
		<p>Algar, Mme v. Heiroth.</p>
		<p>Massage. Work.</p>
		<p>A very jolly day talking of “amour gout” and “amour passion”. Algar has never had anything but the former. Horne was coming to dinner, but it rained pitilessly.</p>
