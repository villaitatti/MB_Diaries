		<p>Saturday, Oct. 12, 1907</p>
		<p>Scott, Rothenstein.</p>
		<p>Telegram from Karin that she was better.</p>
		<p>We went to lunch with the Brocklebanks and afterwards B.B. and Rothenstein went to San Miniato.</p>
		<p>I took Scott to the doctor and we came out by tram. He was indescribably cross and disagreeable.</p>
