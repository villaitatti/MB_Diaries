		<p>Wednesday, Aug. 14, 1907</p>
		<p>2 Morpeth Terrace, London.</p>
		<p>Karin and Ray and Ray’s friend, Margaret Jones, came up, and we met at Dr. Heath’s. They went to the theatre in the evening.</p>
		<p>Bernhard walked with the Rothschild crowd, and then drove with Dora di Rudini to Fex.</p>
