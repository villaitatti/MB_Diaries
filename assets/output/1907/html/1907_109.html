		<p>Thursday, Mar. 28, 1907</p>
		<p>London. Fine.</p>
		<p>Spent day with Karin, but had rather a headache (and an awful cold) and came away soon after tea.</p>
		<p>Geoffrey Scott came in the evening, but I did not enjoy him at all. On the contrary. I am so sorry, too. I think the same was true of him.</p>
