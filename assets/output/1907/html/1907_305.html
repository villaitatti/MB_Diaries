		<p>Thursday, Oct. 10, 1907</p>
		<p>Fine.</p>
		<p>Scott, Rothenstein, Maud Cruttwell.</p>
		<p>Maud came up. B.B. and Rothenstein dined with Mrs. Ross, so we had her to ourselves. Scott meant to dress up as a Spanish lady, but our courage failed us. Maud is <i>too</i> gross.</p>
