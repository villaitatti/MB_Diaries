		<p>Saturday, Apr. 20, 1907</p>
		<p>London.</p>
		<p>Dressmaker’s. Alys and I lunched together.</p>
		<p>I went to Richmond and dined with Michael alone, as Field was ill.</p>
		<p><b>Karin seemed discouragingly deaf</b>. It is too awful. She got up for the first time.</p>
