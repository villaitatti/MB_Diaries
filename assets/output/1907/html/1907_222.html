		<p>Friday, July 19, 1907</p>
		<p>London.</p>
		<p>Karin rallying splendidly. Her glorious vitality makes it all the sadder that she should be maimed. I cannot think of it without weeping.</p>
		<p>B.B. saw Haddon Hall and *Wentworth Woodhouse and Nostell Priory decorated by Adams.</p>
