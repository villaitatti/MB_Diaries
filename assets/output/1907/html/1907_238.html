		<p>Sunday, Aug. 4, 1907</p>
		<p>Court Place.</p>
		<p>Heske and Maitland Radford, Hugh Morgan, Cecil Pinsent, Great doings on the part of all the youngsters.</p>
		<p>I stayed in bed and read and rested.</p>
		<p>Bernhard (at St. Moritz) spend day with Lamberts and Sassoons.</p>
