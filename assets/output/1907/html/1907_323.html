		<p>Monday, Oct. 28, 1907</p>
		<p>Rainy.</p>
		<p>Scott, Rothenstein.</p>
		<p>Drove Scott and Rothenstein to town.</p>
		<p>Scott and I went to see the Perugino fresco and came home in the rain.</p>
		<p>B.B. joined us and we went to call on Mrs. Ross.</p>
		<p>Looked at Mantegnas in the evening.</p>
