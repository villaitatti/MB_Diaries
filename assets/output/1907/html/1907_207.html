		<p>Thursday, July 4, 1907</p>
		<p>Cold. Dull.</p>
		<p>Bernhard went to Windsor with Mme Lambert, and returned to lunch at the Sassoons.</p>
		<p>I shopped, had my bath, heard the music at Mass, and called on Emily and her Mother.</p>
		<p>We both feel astray and lonely and desolate. One often does in first getting to a town.</p>
