		<p>Tuesday, Apr. 23, 1907</p>
		<p>London. Fine.</p>
		<p>Heard Mass at Cathedral — very lovely music. Called on Salting — old bore! — and saw his new Correggio.</p>
		<p>Afternoon with darling Karin.</p>
		<p>Started at 9 for Italy by the Swiss Express.</p>
		<p>Cust and the Rutlands to lunch.</p>
		<p>Algar, Hapgoods and Miss Blood to dine.</p>
