		<p>Monday, Dec. 11, 1905</p>
		<p>Took mrs. Nickerson to call on Mrs. Labouchère.</p>
		<p>Tuesday, Dec. 12, 1905</p>
		<p>Fine.</p>
		<p>Delicious walks and talks.</p>
		<p>Dined with Mrs. Nickerson and Thorolds.</p>
		<p>Wednesday, Dec. 13, 1905</p>
		<p>Cold. Fine.</p>
		<p>Went out in Mrs. Fitzgeralds’s motor to call on Browning. Le Strange was there.</p>
		<p>Fine.</p>
