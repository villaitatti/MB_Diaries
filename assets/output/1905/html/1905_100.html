		<p>Monday, Aug. 7, 1905</p>
		<p>Rain. Cold.</p>
		<p>Very low with cold on chest.</p>
		<p>Tuesday, Aug. 8, 1905</p>
		<p>Cold.</p>
		<p>Our guests all left. I was glad, as my cold was awful. Went to bed. Called in Dr. Duke.</p>
		<p>B.B. dined with Donna de Rudini.</p>
		<p>Wednesday, Aug. 9, 1905</p>
		<p>Cold.</p>
		<p>In bed. Began to read Balzac.</p>
	</body>
