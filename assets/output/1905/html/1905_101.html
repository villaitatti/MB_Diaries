		<p>Thursday, Aug. 10, 1905</p>
		<p>Fine.</p>
		<p>Cold. In bed. Balzac. Mildred Whitall came.</p>
		<p>Fine. Cold.</p>
		<p>Mildred left. Balzac.</p>
		<p>Fine. Cold.</p>
		<p>Friday, Aug. 11, 1905</p>
		<p>Saturday, Aug. 12, 1905</p>
		<p>Walked down to swimming pond.</p>
		<p>Sunday, Aug. 13, 1905</p>
		<p>Fine.</p>
		<p>Cold. Balzac and letters.</p>
