		<p>Thursday, Jan. 23, 1908</p>
		<p>Tatti.</p>
		<p>Fine.</p>
		<p>In the house all day. Cold awful. feeling like devil. What a life! I suffering here, Mother in such pain far away, Karin anxious, poor child, about her ear — what is it all for?</p>
		<p>I read <i>Valerie Upton</i> a good bad-novel.</p>
