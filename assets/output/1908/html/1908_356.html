		<p>Sunday, Nov. 29, 1908</p>
		<p>c/o Mrs. Peter Cooper Hewitt,</p>
		<p>Tuxedo Park <New York></p>
		<p>Motored to lunch with Dr. Prince, Prof. of Hebrew at Columbia.</p>
		<p>Tea with Hewitts at Ringwood. The “Hewitt girls” are too queer for words, especially Sally Hewitt.</p>
		<p>Young Robinson and the Tams came to dine. </p>
