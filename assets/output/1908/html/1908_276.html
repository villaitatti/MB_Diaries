		<p>Thursday, Sept. 10, 1908</p>
		<p>S.S. Marquette.</p>
		<p>Grace with Mary and Harold, I with Ray and Karin and Ellie Rendel</p>
		<p>Reached Antwerp two hours late and had an <u>awful</u> struggle to get the trunks over in time. In fact, the steamer waited awhile for them. We started at 12.10.</p>
