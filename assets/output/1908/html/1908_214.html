		<p>Friday, July 10, 1908</p>
		<p>Members’ Mansions <London></p>
		<p>Came up late from Oxford, after a quiet day, sitting and sewing and chatting with Grandma and Grace.Dined with Gutekunsts, who made us look at a terrible album of Caruso’s sketches and listen to his voice on the gramophone. </p>
