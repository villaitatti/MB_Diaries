		<p>Wednesday, July 22, 1908</p>
		<p>Took Scott to have tea with the Rothensteins. Frank Darwin and his nice frumpy daughter were there. We all went to see Isadora Duncan in the evening.</p>
		<p>Lady Ottoline and Logan were there, and Logan introduced Scott to Lady Ottoline and they made great friends. </p>
