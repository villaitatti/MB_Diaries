		<p>Thursday, June 11, 1908</p>
		<p>I Tatti. </p>
		<p>Fine.</p>
		<p>Spent morning discussing building, drainage, etc. with the architect, the ragioniere, the fattore and the Triulzi. Paid bills.</p>
		<p>Both of us feeling frightfully tired.</p>
		<p>Mrs. Ross with Dr. Lindsay and Ch. Lacaita came to dine.</p>
