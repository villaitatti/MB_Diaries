		<p>Tuesday, Aug. 4, 1908</p>
		<p>Iffley.</p>
		<p>Fine warm weather. </p>
		<p>Trevy, Marjorie Strachey, Billy, Rukhmabai. </p>
		<p>Trevy left. Went in to see galleries with Sirén and Billy. </p>
		<p>Sirén came to lunch and dinner. We swam and looked at photographs and talked with Sirén about “The Purple Mother” whose disciple he is. </p>
