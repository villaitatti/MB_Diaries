		<p>Wednesday, Nov. 25, 1908</p>
		<p>We lunched with the Percival Lowells, who had the Bowlkers. Called on the Morton Princes, Summers, etc. </p>
		<p>Had tea with a Mrs. Bradley and young Hopkinson came in. Dined with the Fiske Warrens, Isabella, the Beazleys and various other people. I like Mrs. Fiske somehow. </p>
