		<p>Sunday, May 24, 1908 </p>
		<p>Grand Hotel des Palmes, Palermo.</p>
		<p>Rain! a miracle at this season.</p>
		<p>Very cool — a refreshing contrast.</p>
		<p>Saw churches, including the one of the “Sicilian Vespers”.</p>
		<p>Called on Trabias. </p>
