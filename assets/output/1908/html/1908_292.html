		<p>Saturday, Sept. 26, 1908</p>
		<p>Germantown. </p>
		<p>Packed. Came here. It is worse even than I remembered. Aunty Lill is deafer and dottier and more hypocritical and requires more lies than she used to, although it was horrible enough five years ago. Alban is really very kind and good. </p>
