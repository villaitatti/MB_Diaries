		<p>Saturday, Aug. 1, 1908</p>
		<p>Iffley.</p>
		<p>Fine.</p>
		<p>Trevy, M. Strachey, the Milhollands, Billy, Rukhmabai. </p>
		<p>Chatting and loafing. </p>
		<p>We motored to Ewelme and Dorchester and Newington, Logan, Trevy, B.B. and Rukhmabai and myself. Very pleasant </p>
