		<p>Thursday, Oct. 29, 1908</p>
		<p>Dorchester.</p>
		<p>Rain.</p>
		<p>Bernhard and Ralph Perry went to a lecture by Barrett Wendell. I went to Rachel’s and played with her jolly baby. We had lunch there. I came home feeling very ill with a cold. </p>
		<p>Bernhard called on Miss Norton. </p>
