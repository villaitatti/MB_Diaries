		<p>Saturday, Feb. 22, 1908</p>
		<p>Scirocco. Warm.</p>
		<p>School of Filippo.</p>
		<p>Quiet day of work,with a long walk over the hills. Saw no one except Dr. Giglioli, Miss Alexander and our fattore, Carlo Marilli.</p>
		<p>Am reading a most interesting life of David, who offers a close parallel to Mantegna. </p>
