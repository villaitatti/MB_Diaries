		<p>Saturday, Oct. 31, 1908</p>
		<p>Hotel Somerset, Boston.</p>
		<p>48. Cold. Clear.</p>
		<p>Corrected proofs and then went to lunch with Mr. and Mrs. Brooks Adams at the Old House, Quincy. A Miss Lane and a Mr. Abbott of Wellesley were there. Agreeable people.</p>
		<p>We then came here and unpacked. Mrs. Gardner called. </p>
