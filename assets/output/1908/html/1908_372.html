		<p>Tuesday, Dec. 15, 1908</p>
		<p>The Deanery, Bryn Mawr. </p>
		<p>Johnsons in morning. </p>
		<p>Lunched with Mrs. Kirkbride and Dr. and Mrs. Anderson (he a brain specialist at work in <u>Wistn</u> Institute).</p>
