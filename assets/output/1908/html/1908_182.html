		<p>Monday, June 8, 1908</p>
		<p>I Tatti.</p>
		<p>Cool. Fine.</p>
		<p>Travelled up from Naples to Florence 8.40-8.25. Placci was with us. Nora Ruffo met us at the Roman <i>gare</i>, and we had a little chat. I think she has been in love with B.B., and still is a little. </p>
		<p>I Tatti</p>
