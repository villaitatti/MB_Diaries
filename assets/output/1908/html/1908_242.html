		<p>Friday, Aug. 7, 1908</p>
		<p>Iffley.</p>
		<p>Fine.</p>
		<p>2 Keynes, M. Strachey, Scott, Billy.</p>
		<p>Brought Scott down by the 1.45. Were met by Karin and Keynes. </p>
		<p>Came back by launch. They played “Bleeding Grab” in the evening, and we looked over “The Germ”, which Bain is trying to persuade me to buy at £23. </p>
