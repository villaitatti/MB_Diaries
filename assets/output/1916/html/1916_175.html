		<p>Thursday, July 20, 1916, I Tatti</p>
		<p>G[eoffrey] S[cott] Eugénie [Strong]</p>
		<p>Hot</p>
		<p>Eugénie Strong arrived at 2 with the old British School and the British Museum thumping along behind her like Fafner and Fasold.</p>
		<p>Parry’s baby, Roberto, was born while he was meeting Eugenie.</p>
