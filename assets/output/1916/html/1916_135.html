		<p>Monday, May 29, 1916, Naples</p>
		<p>G[eoffrey] S[cott] Nora Grifeo</p>
		<p>Saw Ravello in the morning the pulpits and the head in the Duomo and the pulpit which hasn’t plates in S. Giovanni Taro. </p>
		<p>Came back around Vesuvius - a much nice way. Nora very attractive. </p>
