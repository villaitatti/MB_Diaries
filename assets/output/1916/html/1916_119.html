		<p>Saturday, May 13, 1916, Caprarola</p>
		<p>Arrived here to tea and found Thryphosa Bates Batcheller and her husband, who have been here for a week. He sang and praised her own voice and talked about the Infanta Eulalia. Reach a goose.</p>
		<p>This was May 17.</p>
