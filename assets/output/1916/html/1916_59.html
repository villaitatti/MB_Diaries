		<p>Monday, February 21, 1916, Paris</p>
		<p>Feeling very ill – worse -  Weissmanncame. He says I can leaveon Saturday only. I sent off his letter about N[ikky] which he read to me. Very wise and sincere but goodness I think it will be of no use at all when they meet. </p>
