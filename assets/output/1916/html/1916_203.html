		<p>Saturday, August 26, 1916, Marina di Massa</p>
		<p>Bathed twice. Motored back to look at sites. But both B.B. and I feel so ill and depressed here that I fear the sea doesn’t suit us. B.B. says he is thoroughly fed up and bored with Sybil, who only clings to him the more. </p>
