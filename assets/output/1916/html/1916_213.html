		<p>Monday, September 4, 1916, Vallombrosa</p>
		<p>Lovely walk - After lunch I had a talk with Yoï, and told her I never had and never could believe her. She was rather awful, and I got the feeling that she would do and say <u>anything</u>, and that she was a regular old hand at rows and abuse. </p>
