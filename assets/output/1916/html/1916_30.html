		<p>Monday, January 24, 1916, Havre to Southampton, Paris</p>
		<p>Bribedchildren to sleep and had lunch with Edith Wharton. </p>
		<p><u>Awful</u> crowd on quai at Havre<b>. </b>Beastly arrangement. Should had to sit up all night in corridor of boat but for an angelic American youth named Porter, who gave me his cabin. </p>
